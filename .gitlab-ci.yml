# Проверки на каждый пуш: формат, vet, интеграционные тесты на живом Postgres
# и синтаксис фронтенда (он без сборки — ошибку в JS иначе увидишь только в браузере).
stages: [test]

go:
  stage: test
  image: golang:1.26
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: lifeplan_test
    POSTGRES_USER: lifeplan
    POSTGRES_HOST_AUTH_METHOD: trust
    TEST_DATABASE_URL: "postgres://lifeplan@postgres:5432/lifeplan_test?sslmode=disable"
    GOFLAGS: "-mod=readonly"
  cache:
    key: go-mod
    paths: [.go/pkg/mod]
  before_script:
    - export GOPATH="$CI_PROJECT_DIR/.go"
  script:
    - test -z "$(gofmt -l cmd internal)" || (gofmt -l cmd internal && false)
    - go vet ./...
    - go test -p 1 ./...
    - CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/lifeplan ./cmd/plan

web:
  stage: test
  image: node:22-alpine
  script:
    - node --check internal/web/static/app.js
    - node --check internal/web/static/sw.js
