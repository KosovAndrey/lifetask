# lifetask.ru — HTTP: выпуск сертификата и редирект на HTTPS.
# Кладётся в ~/projects/tryberrybot/nginx/conf.d/ (nginx общий с tryberry).
# Порядок выкатки — docs/DEPLOY.md, раздел «Домен».
server {
    listen      80;
    listen      [::]:80;
    server_name lifetask.ru www.lifetask.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://lifetask.ru$request_uri;
    }
}
