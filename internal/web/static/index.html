<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LifeTask">
<title>LifeTask</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<header class="top">
  <nav class="tabs" aria-label="Разделы">
    <a href="#/day" data-tab="day">День</a>
    <a href="#/week" data-tab="week">Неделя</a>
    <a href="#/board" data-tab="board">Доска</a>
    <a href="#/inbox" data-tab="inbox">Входящие <span class="badge" id="inbox-count" hidden></span></a>
    <a href="#/journal" data-tab="journal">Дневник</a>
    <a href="#/notes" data-tab="notes">Заметки</a>
    <a href="#/stats" data-tab="stats">Аналитика</a>
    <a href="#/graph" data-tab="graph">Граф</a>
  </nav>
  <a class="badge queue" id="queue-count" href="#/inbox" title="Ждут отправки — список во «Входящих»" hidden></a>
  <div class="offline" id="offline" role="status" hidden></div>
</header>
<main id="view" aria-live="polite"></main>
<button class="fab" id="fab" aria-label="Новая задача">+</button>
<div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Задача" hidden></section>
<div class="toast" id="toast" role="status" hidden></div>
<div class="tip" id="tip" role="tooltip" hidden></div>
</body>
</html>
